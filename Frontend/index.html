<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!--
      Política de contenido: declara de qué orígenes acepta cargar cosas el sitio.
      Lo que más importa es `script-src 'self'` SIN 'unsafe-inline': eso es lo que impide
      que un onerror= u onclick= inyectado en un nombre o una placa llegue a ejecutarse.
      El 'unsafe-inline' de style-src sí es inevitable: el compilador de Tailwind inyecta
      un <style> en caliente y el sitio usa style="..." en decenas de lugares.

      `connect-src` LISTA LOS DOS ORÍGENES DEL API a propósito: el de producción y el
      local. Este <meta> es estático —el sitio no tiene build— así que no puede saber
      dónde está corriendo, pero la cabecera que manda server.js sí, y el navegador APLICA
      LAS DOS POLÍTICAS A LA VEZ: una petición tiene que pasar por ambas. Entonces la
      cabecera es la que acota a un solo origen según el entorno, y acá se dejan los dos
      para no bloquear ninguno. Si en cambio acá quedara solo uno y en la cabecera solo el
      otro, la intersección se quedaría sin ninguno y no andaría en ningún lado.

      Si cambia el dominio del API hay que tocarlo acá, en API_ORIGIN_PRODUCCION de
      data.js y en la variable API_ORIGIN del servicio del sitio.

      `frame-ancestors` NO va acá: no funciona en un <meta>. Va como cabecera, en server.js.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://media.base44.com; frame-src https://www.google.com; connect-src 'self' https://api.cdavalledupar.com http://localhost:3000; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Título y descripción: son el titular azul y el párrafo gris del resultado de
      Google, no adornos. Se escriben con las palabras que la gente ESCRIBE en el
      buscador —"CDA Valledupar", "revisión técnico-mecánica", "gases"— y no con el
      nombre de marca, que nadie busca porque nadie lo conoce todavía.

      El largo importa: el título se corta cerca de los 60 caracteres y la
      descripción cerca de los 155. Lo que pase de ahí se reemplaza por "…" y se
      pierde. Antes acá decía "AutoCheck Pro", que gastaba un tercio del título en
      una marca sin volumen de búsqueda.
    -->
    <meta
      name="description"
      content="Centro de diagnóstico automotor en Valledupar, Cesar. Revisión técnico-mecánica y de gases para motos y vehículos. Agenda tu cita en línea."
    />
    <meta
      name="keywords"
      content="CDA Valledupar, revisión técnico-mecánica Valledupar, revisión de gases, diagnóstico automotriz, agendar cita CDA, centro de diagnóstico automotriz"
    />
    <meta name="author" content="CDA de Valledupar" />

    <!--
      URL canónica, y las etiquetas og: de acá abajo: son el valor de la HOME.
      El router las reescribe en cada cambio de ruta (ver aplicarMetadatosDeRuta
      en app.js), porque ahora cada página es una URL de verdad y dejar esto fijo
      declararía que las seis son la misma —que es peor que no tenerlo—.

      Quedan igual escritas acá, y no solo puestas por JavaScript, porque son lo
      que leen WhatsApp y Facebook al previsualizar un enlace: esos rastreadores
      NO ejecutan JavaScript y se llevarían la página sin título ni imagen.
    -->
    <link rel="canonical" href="https://cdavalledupar.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CDA de Valledupar" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://cdavalledupar.com/" />
    <meta property="og:title" content="CDA de Valledupar | Revisión Técnico-Mecánica y de Gases" />
    <meta property="og:description" content="Agenda tu revisión técnico-mecánica y de gases en Valledupar. Motos, vehículos livianos y pesados." />
    <!--
      Sin og:image, cuando alguien pega el enlace en WhatsApp —que es por donde
      se va a compartir esto— sale un recuadro gris sin imagen. Tiene que ser
      absoluta: los clientes de WhatsApp y Facebook no resuelven rutas relativas.
    -->
    <meta property="og:image" content="https://cdavalledupar.com/assets/img/fachada-cda.webp" />
    <meta property="og:image:alt" content="CDA de Valledupar, centro de diagnóstico automotor" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>CDA de Valledupar | Revisión Técnico-Mecánica y de Gases</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!--
      El ícono que Google muestra al lado del resultado, y el de la pestaña del
      navegador. Sin esto el buscador pone una bolita gris genérica, que al lado
      de un competidor que sí tiene su logo se lee como un sitio menos serio.

      SE SALTA LA CONVENCIÓN DEL `?v=` A PROPÓSITO. Google se guarda la dirección
      del ícono y la vuelve a pedir en el próximo rastreo; si esa dirección
      cambiara en cada despliegue, cada versión sería un ícono nuevo que tendría
      que volver a descubrir desde cero. Acá conviene una dirección estable, y la
      caché de un día que server.js ya le da alcanza de sobra.

      Es cuadrado y de 192 px —múltiplo de 48, que es lo que Google exige— y sale
      del logo del CDA recortado a la marca: a 16 px, que es el tamaño real en el
      buscador, "DE VALLEDUPAR" no se lee y solo ensucia el ícono.
    -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css?v=54" />
    <!--
      Tailwind servido desde el propio sitio, ya no desde el CDN de un tercero (la
      procedencia del archivo está en la cabecera de assets/vendor/tailwind.js).
      El orden importa: la configuración necesita que el compilador ya esté cargado.
    -->
    <script src="/assets/vendor/tailwind.js?v=54"></script>
    <script src="/assets/vendor/tailwind-config.js?v=54"></script>
    <!--
      Ficha del negocio para Google, en JSON-LD.

      Es lo que alimenta el panel lateral del buscador y lo que le permite cruzar
      este sitio con la ficha del negocio en Maps. Para que ese cruce funcione,
      NOMBRE, DIRECCIÓN Y TELÉFONO tienen que decir EXACTAMENTE lo mismo acá, en
      el Perfil de Empresa de Google y en el pie del sitio. Si difieren —"Cra."
      contra "Carrera", el celular con o sin indicativo— Google no está obligado
      a deducir que son el mismo negocio, y a veces no lo deduce.

      POR ESO `name` NO DICE "CDA de Valledupar" aunque sea así como el sitio se
      presenta en el encabezado, en el pie y en todo el texto. `name` está copiado
      carácter por carácter del Perfil de Empresa —sin las tildes de "Diagnostico"
      y "Automotriz", tal como está allá— y el nombre corto quedó en
      `alternateName`, que existe justo para esto.

      La corrección va de este lado y NUNCA al revés: el nombre del perfil tiene
      que ser el del aviso del local. Editarlo para que "combine" con el sitio, o
      para meterle palabras clave, es de las cosas por las que Google suspende una
      ficha —y esta ficha carga 137 opiniones, que no se recuperan—.

      NADA DE ACÁ ESTÁ INVENTADO. Todo sale de lo que el sitio ya publica:
      el horario es el de CDA.horario en data.js (el mismo que responde el
      asistente), y las coordenadas son las del mapa que ya se muestra en la
      página de contacto —ver CDA.maps, parámetros !3d (latitud) y !2d (longitud)—.
      Eso significa que hereda su estado: el horario está en la lista de datos
      pendientes de ratificar con el propietario. Si el horario real es otro, se
      corrige en data.js Y acá.

      Lo que NO se puso, y por qué: `priceRange`, porque las tarifas del sitio son
      referenciales y el propietario todavía no las ratificó; `postalCode`, porque
      nadie lo confirmó; y `sameAs`, porque no hay perfiles de redes verificados.
      Un dato inventado en la ficha de un negocio real no es un detalle de SEO.

      Tampoco hay un bloque FAQPage aunque el sitio tenga preguntas frecuentes:
      desde 2023 Google solo muestra ese resultado enriquecido a sitios de salud y
      de gobierno. Sería duplicar faqItems de data.js —con la deriva que eso trae—
      a cambio de nada.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRepair",
        "@id": "https://cdavalledupar.com/#negocio",
        "name": "Centro de Diagnostico Automotriz Valledupar",
        "alternateName": "CDA de Valledupar",
        "description": "Centro de diagnóstico automotriz en Valledupar con revisión técnico-mecánica, revisión de gases y agendamiento en línea.",
        "url": "https://cdavalledupar.com/",
        "image": "https://cdavalledupar.com/assets/img/fachada-cda.webp",
        "telephone": "+573166962144",
        "email": "contacto@cdavalledupar.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Cra. 18D #47 17, San Fernando",
          "addressLocality": "Valledupar",
          "addressRegion": "Cesar",
          "addressCountry": "CO"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 10.4420096,
          "longitude": -73.2419344
        },
        "hasMap": "https://www.google.com/maps?cid=12238969371853820228",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "07:30",
            "closes": "18:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "07:30",
            "closes": "16:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "PublicHolidays",
            "opens": "08:00",
            "closes": "12:00"
          }
        ],
        "areaServed": {
          "@type": "City",
          "name": "Valledupar",
          "addressRegion": "Cesar",
          "addressCountry": "CO"
        },
        "potentialAction": {
          "@type": "ReserveAction",
          "name": "Agendar cita",
          "target": "https://cdavalledupar.com/agendar"
        }
      }
    </script>
